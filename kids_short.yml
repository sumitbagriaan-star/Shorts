name: Daily YouTube Short Generator

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      video_link:
        description: "Optional: paste a YouTube video link to inspire the topic (leave empty for random)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate the short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_LINK: ${{ github.event.inputs.video_link }}
        run: python main_generate.py

      - name: Commit and push generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/short_*.mp4 outputs/short_*_info.txt
          git commit -m "Auto-generated short - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push
